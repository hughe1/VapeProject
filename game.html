<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vapour Lock</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #gameWindowWrapper {
            position: relative;
            width: 360px;
            height: 340px;
            margin: 0 auto;
        }
        #canvas2d {
            background: #1e293b;
            display: block;
            border-radius: 20px;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);
            border: 2px solid #334155;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* VISIBLE NAVIGATION STATISTICS BAR AT TOP */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-weight: 800;
            color: #1e293b; 
            font-size: 15px;
            margin-bottom: 10px;
            padding: 0 10px;
        }
        /* CENTERED DEATH OVERLAY CAPTURE MENU */
        #interactiveGameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 360px;
            height: 340px;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 20px;
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border: 2px solid #ef4444;
            box-sizing: border-box;
        }
        .game-over-title {
            color: #ef4444;
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 6px 0;
        }
        .game-over-sub {
            color: #94a3b8;
            font-size: 13px;
            margin: 0 0 20px 0;
            font-weight: 600;
        }
        .try-again-btn {
            background: #6366f1;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <header class="app-header">
            <h1>Vapour Lock</h1>
            <p>Use Left and Right Arrow Keys!</p>
        </header>

        <main class="app-content">
            <!-- ACTIVE LIVE STATS TOP PANEL -->
            <div class="stats-bar">
                <div id="scoreLabel">Score: 0</div>
                <div id="highScoreLabel">Best: 0</div>
                <div id="speedLabel">Danger: 1</div>
            </div>
            
            <div id="gameWindowWrapper">
                <canvas id="canvas2d" width="360" height="340"></canvas>
                
                <!-- RED MENU CARD WITH MIDDLE ALIGNED STATS -->
                <div id="interactiveGameOverScreen">
                    <h2 class="game-over-title">VAPOUR LOCKED 🚨</h2>
                    <p class="game-over-sub">Addiction traps slowed down your lungs.</p>
                    <div id="finalScoreLabel" style="font-size: 18px; font-weight: 800; color: #ffffff; margin-bottom: 4px; text-align: center;">Final Score: 0</div>
                    <div id="finalHighLabel" style="font-size: 16px; font-weight: 800; color: #10b981; margin-bottom: 24px; text-align: center;">Best Score: 0</div>
                    <button class="try-again-btn" onclick="resetGameEngineState()">Try Again 🔄</button>
                </div>
            </div>
            
            <p style="font-size:12px; text-align:center; font-weight:700; color:var(--text-muted); margin-top:12px; line-height:1.4;">
                Dodge the vape clouds and cigarettes! They get bigger and faster over time.
            </p>
        </main>
        <script>
            const canvas = document.getElementById("canvas2d");
            const ctx = canvas.getContext("2d");
            const scoreLabel = document.getElementById("scoreLabel");
            const highScoreLabel = document.getElementById("highScoreLabel");
            const speedLabel = document.getElementById("speedLabel");
            const gameOverScreen = document.getElementById("interactiveGameOverScreen");
            const finalScoreLabel = document.getElementById("finalScoreLabel");
            const finalHighLabel = document.getElementById("finalHighLabel");

            // Game System Configuration Variables
            let gameActive = true;
            let score = 0;
            let difficultyTimer = 0;
            let obstacleSpeed = 3;
            let obstacleSize = 20; 

            // High Score Persistent Local Browser Cache Storage
            let highScore = parseInt(localStorage.getItem("vapour_lock_high")) || 0;
            highScoreLabel.innerText = "Best: " + highScore;

            // Player dimensions setup
            let playerX = 165;
            const playerY = 290;
            const playerWidth = 30;
            const playerHeight = 30;

            let leftPressed = false;
            let rightPressed = false;
            let obstacles = [];

            // Hardware Button Listeners Mapping
            window.addEventListener("keydown", function(e) {
                if (e.key === "ArrowLeft") leftPressed = true;
                if (e.key === "ArrowRight") rightPressed = true;
            });

            window.addEventListener("keyup", function(e) {
                if (e.key === "ArrowLeft") leftPressed = false;
                if (e.key === "ArrowRight") rightPressed = false;
            });

            function initializeObstaclePool() {
                obstacles = [
                    { x: 40, y: -60, type: "💨" },
                    { x: 180, y: -220, type: "🚬" },
                    { x: 290, y: -380, type: "💨" }
                ];
            }

            function runActiveEngineUpdateLoop() {
                if (!gameActive) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Dinosaur continuous score counter ticks up on every frame paint
                score += 1;
                scoreLabel.innerText = "Score: " + score;

                // Instantly update top High Score tracker if player sets new milestone
                if (score > highScore) {
                    highScore = score;
                    highScoreLabel.innerText = "Best: " + highScore;
                    localStorage.setItem("vapour_lock_high", highScore);
                }

                // Progressive Hazard scaling adjustments rules
                difficultyTimer++;
                if (difficultyTimer % 150 === 0) { 
                    obstacleSpeed += 0.45;
                    obstacleSize += 2.0;
                    const hazardStageLevel = Math.floor(obstacleSpeed - 2);
                    speedLabel.innerText = "Danger: " + hazardStageLevel;
                }

                // Handle Character boundary tracks step movement
                if (leftPressed && playerX > 5) playerX -= 4.8;
                if (rightPressed && playerX < canvas.width - playerWidth - 5) playerX += 4.8;

                // Render Active Lungs Player Shield Vector 
                ctx.fillStyle = "#10b981";
                ctx.beginPath();
                ctx.roundRect(playerX, playerY, playerWidth, playerHeight, 8);
                ctx.fill();
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 15px sans-serif";
                ctx.fillText("🫁", playerX + 4, playerY + 21);
                // --- UPDATE & RENDER ADDICTION HAZARDS ---
                obstacles.forEach(obs => {
                    obs.y += obstacleSpeed;

                    ctx.font = obstacleSize + "px sans-serif";
                    ctx.fillText(obs.type, obs.x, obs.y);

                    const boxX = obs.x;
                    const boxY = obs.y - (obstacleSize * 0.7);
                    const boxSize = obstacleSize;

                    // Hitbox Collision Check Logic
                    if (playerX < boxX + boxSize &&
                        playerX + playerWidth > boxX &&
                        playerY < boxY + boxSize &&
                        playerY + playerHeight > boxY) {
                        
                        gameActive = false;
                        triggerSystemGameOverState();
                    }

                    // Recycle elements when they pass screen bottom bounds
                    if (obs.y > canvas.height + 40) {
                        obs.y = -50 - (Math.random() * 150);
                        obs.x = 10 + Math.random() * (canvas.width - 40);
                    }
                });

                requestAnimationFrame(runActiveEngineUpdateLoop);
            }

            // --- INSTANT CLEAN DEATH WIPE SYSTEM ---
            function triggerSystemGameOverState() {
                // Wipe the canvas clear instantly
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Clear the obstacles array so emojis disappear immediately
                obstacles = [];

                // Update text elements on the centered death menu overlay card
                finalScoreLabel.innerText = "Final Score: " + score;
                finalHighLabel.innerText = "Best Score: " + highScore;
                gameOverScreen.style.display = "flex";
            }

            // --- INTERACTIVE TRY AGAIN RESET LOGIC ---
            window.resetGameEngineState = function() {
                gameOverScreen.style.display = "none";
                score = 0;
                difficultyTimer = 0;
                obstacleSpeed = 3;
                obstacleSize = 20;
                playerX = 165;
                leftPressed = false;
                rightPressed = false;

                scoreLabel.innerText = "Score: 0";
                speedLabel.innerText = "Danger: 1";

                initializeObstaclePool();
                gameActive = true;
                requestAnimationFrame(runActiveEngineUpdateLoop);
            };

            initializeObstaclePool();
            requestAnimationFrame(runActiveEngineUpdateLoop);
        </script>

        <nav class="bottom-nav">
            <a href="index.html"><span class="nav-icon">🏠</span>Home</a>
            <a href="info.html"><span class="nav-icon">📄</span>Info</a>
            <a href="facts.html"><span class="nav-icon">🧪</span>Quiz</a>
            <a href="game.html" class="active"><span class="nav-icon">🎮</span>Game</a>
            <a href="support.html"><span class="nav-icon">🆘</span>Support</a>
        </nav>
    </div>

</body>
</html>
